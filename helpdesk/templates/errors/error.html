{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="{{ 'panel error-page' if g.user else 'stub error-page' }}">
  <div class="{{ 'error-inner' if g.user else 'stub-head' }}">
    <p class="error-code">Error {{ code }}</p>
    <h1>{{ title }}</h1>
    <p class="error-message">{{ message }}</p>
    <a class="btn" href="{{ url_for('index') }}">{{ 'Go to your home page' if g.user else 'Go to sign in' }}</a>
  </div>
</section>
{% endblock %}

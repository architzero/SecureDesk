{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flashes" role="status">
  {% for category, message in messages %}
  <p class="flash flash-{{ category if category in ('success', 'error', 'info') else 'info' }}">{{ message }}</p>
  {% endfor %}
</div>
{% endif %}
{% endwith %}
